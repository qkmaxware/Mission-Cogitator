{
    "name": "Advanced Auspex Scan",
    "kind": "firefight"
}
---
Use this firefight ploy when a friendly 
DEATHWATCH operative performs the 
<see cref="shoot">Shoot</see> action. Until the end of the activation/
<see cref="counteract">counteraction</see>, its ranged weapons have the 
<see cref="saturate">Saturate</see> weapon rule and enemy operatives 
cannot be obscured.
