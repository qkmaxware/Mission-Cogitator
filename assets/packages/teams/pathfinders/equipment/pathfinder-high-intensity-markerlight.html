---
{
    "name": "High-Intensity Markerlight"
}
---
Up to twice per turning point, when a friendly 
PATHFINDER operative (excluding MV7 
MARKER DRONE) performs the Markerlight 
action, you can use this rule. If you do, the enemy 
operative you select gains two of your <see cref="pathfinder-markerlight">Markerlight</see> 
tokens (instead of one).
