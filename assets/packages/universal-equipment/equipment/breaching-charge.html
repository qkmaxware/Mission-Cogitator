---
{
    "name": "Breaching Charge"
}
---
Once per battle, when a friendly operative 
performs the <see cref="breach">Breach</see> action, you can use this rule. 
If you do, that operative can perform that action 
for 1 less AP (to a minimum of 1AP) as though it 
had the word "breach marker" on its datacard.
