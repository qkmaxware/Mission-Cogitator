<body>
    <div id="app">
        <header id="loading-header" class="loading-progress-heading">Loading App...</header>
        <svg id="loading-spinner" class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div id="loading-percent" class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    
    <div id="pwa-update-notification" class="w3-row">
        <table style="vertical-align: middle;">
            <tbody>
                <tr>
                    <td>
                        A new version is available
                    </td>
                    <td style="width: 6em;">
                        <button id="pwa-update-reload" class="w3-button w3-bar-item app-primary w3-round">RELOAD</button>
                    </td>
                </tr>
            </tbody>
        </table> 
    </div>
    <script>
        const loadingHeader = document.getElementById("loading-header");
        const loadingSpinner = document.getElementById("loading-spinner");
        const loadingPercent = document.getElementById("loading-percent");
        window.updateLoader = function(percent, title) {
            document.documentElement.style.setProperty('--blazor-load-percentage', `${percent}%`);
            document.documentElement.style.setProperty('--blazor-load-percentage-text', `"${percent}%"`);

            if (title) {
                loadingHeader.innerText = title;
            }
        }
    </script>
    <script src="_framework/blazor.webassembly.958z1vx7fr.js"></script>
    <script>
        const pwaNotification = document.getElementById("pwa-update-notification");
        const pwaUpdateBtn = document.getElementById("pwa-update-reload");
        let pwaServiceWorkerUpdate = null;
        pwaUpdateBtn.addEventListener('click', function(){
            if (!pwaServiceWorkerUpdate)
                return;
            pwaServiceWorkerUpdate.postMessage({ action: 'skipWaiting' });
        });
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(reg => {
                reg.addEventListener('updatefound', () => {
                    pwaServiceWorkerUpdate = reg.installing;

                    pwaServiceWorkerUpdate.addEventListener('statechange', () => {
                        switch (pwaServiceWorkerUpdate.state) {
                            case 'installed': 
                                if (navigator.serviceWorker.controller) {
                                    pwaNotification.classList.add('w3-show');
                                }
                                break;
                        }
                    });
                });
            });
            
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function () {
                if (refreshing) 
                    return;
                window.location.reload();
                refreshing = true;
            });
        }
        
        window.downloadFileFromStream = async (fileName, contentStreamReference) => {
            const arrayBuffer = await contentStreamReference.arrayBuffer();
            const blob = new Blob([arrayBuffer]);
            const url = URL.createObjectURL(blob);
            const anchorElement = document.createElement('a');
            anchorElement.href = url;
            anchorElement.download = fileName ?? '';
            anchorElement.click();
            anchorElement.remove();
            URL.revokeObjectURL(url);
        }
        window.getCaretPosition = (element) => {
            if (!element) return {start: 0, end: 0};
            return {start: element.selectionStart, end: element.selectionEnd};
        };
        window.preventTabbing = (element) => {
            if (!element) return
            
            function tabKeyHandler(e) {
                const TABKEY = 9;
                if(e.keyCode == TABKEY) {
                    if(e.preventDefault) {
                        e.preventDefault();
                    }
                    return false;
                }
            }
            element.addEventListener('keydown', tabKeyHandler, false);
        }
        window.addDotNetEventListener = (dotNetRef, eventName, methodName) => {
            const handler = (event) => {
                // Pass any relevant event properties back to C#
                dotNetRef.invokeMethodAsync(methodName, event.key || event.type);
            };

            window.addEventListener(eventName, handler);

            // Return a function or token to easily remove it later
            return {
                dispose: () => window.removeEventListener(eventName, handler)
            };
        }
    </script>
