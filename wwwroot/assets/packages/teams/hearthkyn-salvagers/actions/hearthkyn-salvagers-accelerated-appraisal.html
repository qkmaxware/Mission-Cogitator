<ul class="usage-bullets">
    <li>
        If your Attack or Defence marker is in the killzone, remove it.
    </li>
    <li>
        Place your Attack or Defence marker in the killzone.
    </li>
</ul>

<ul class="condition-bullets">
    <li>
This operative cannot perform this action unless an enemy operative is within its 
<see cref="control-range">control range</see>.
    </li>
</ul>
