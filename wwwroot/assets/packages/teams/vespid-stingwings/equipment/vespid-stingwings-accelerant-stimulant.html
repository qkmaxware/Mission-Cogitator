---
{
    "name": "Accelerant Stimulant"
}
---
Whenever a friendly VESPID STINGWING 
operative (excluding OVERSIGHT DRONE) 
performs the <see cref="charge">Charge</see> or <see cref="dash">Dash</see> action, it can move 
an additional 1". If it uses <see cref="vespid-stingwing-fly">FLY</see> for this action, you 
can set it back up 1" further away.
