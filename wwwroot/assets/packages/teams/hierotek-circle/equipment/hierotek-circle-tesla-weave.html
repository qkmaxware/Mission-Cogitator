---
{
    "name": "Tesla Weave"
}
---
Once per turning point, when an enemy operative 
ends the <see cref="charge">Charge</see> action with friendly <b>HIEROTEK</b> 
<b>CIRCLE</b> operatives within its control range, you 
can use this rule. If you do, inflict <b>D3+1</b> damage 
on that enemy operative.
