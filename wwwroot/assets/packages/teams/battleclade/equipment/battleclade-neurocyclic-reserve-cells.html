---
Once per turning point, whenever you <see cref="battleclade-transfer-power">TRANSFER 
POWER</see>, you can use this rule. If you do, you 
can <see cref="battleclade-transfer-power">TRANSFER POWER</see> for 0AP (this takes 
precedence over the normal <see cref="battleclade-noospheric-network">Noospheric 
Network</see> rules).
