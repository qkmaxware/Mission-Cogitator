This operative can perform the <see cref="shoot">Shoot</see> action with 
this weapon while within <see cref="control-range">Control Range</see> of an enemy operative. 
Don’t select a <see cref="valid-target">Valid Target</see>. Instead, this operative is always the 
primary target and cannot be in <see cref="cover">Cover</see> or obscured.
